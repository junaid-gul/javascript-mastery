<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Traversal</title>
    <link rel="stylesheet" href="style.css">
    

</head>

<body>

    <main class="container">

        <h1>DOM Traversal Practice</h1>

        <p class="subtitle">
            One HTML file for the entire chapter.
        </p>

        <!-- Products -->

        <section class="products-section">

            <h2>Products</h2>

            <div class="products">

                <article class="card" data-id="1">

                    <h3>Laptop</h3>

                    <p class="price">$999</p>

                    <button class="buy-btn">
                        Buy Now
                    </button>

                </article>

                <article class="card" data-id="2">

                    <h3>Phone</h3>

                    <p class="price">$699</p>

                    <button class="buy-btn">
                        Buy Now
                    </button>

                </article>

                <article class="card" data-id="3">

                    <h3>Headphones</h3>

                    <p class="price">$199</p>

                    <button class="buy-btn">
                        Buy Now
                    </button>

                </article>

            </div>

        </section>

        <!-- Todo List -->

        <section class="todo-section">

            <h2>Todo List</h2>

            <ul id="todo-list">

                <li>Learn HTML</li>

                <li>Learn CSS</li>

                <li>Learn JavaScript</li>

            </ul>

        </section>

        <!-- Contact Form -->

        <section class="contact-section">

            <h2>Contact Form</h2>

            <form id="contact-form">

                <input
                    type="text"
                    placeholder="Your Name"
                >

                <input
                    type="email"
                    placeholder="Your Email"
                >

                <button type="submit">
                    Send
                </button>

            </form>

        </section>

        <!-- Footer -->

        <footer>

            <h2>Useful Links</h2>

            <div class="footer-links">

                <a href="#">Home</a>

                <a href="#">About</a>

                <a href="#">Contact</a>

            </div>

        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
