<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Events Playground</title>
  <link rel="stylesheet" href="style.css">
  

</head>

<body>

  <h1>JavaScript Events Playground</h1>

  <div class="container">

    <!-- Click Events -->
    <section class="card">
      <h2>Click Events</h2>

      <button id="clickBtn">Click Me</button>
      <button id="doubleBtn">Double Click Me</button>

      <div class="output" id="clickOutput">
        
        Clicked <span id="count"></span> time
      </div>
    </section>

    <!-- Mouse Events -->
    <section class="card">
      <h2>Mouse Events</h2>

      <div class="box" id="mouseBox">
        Hover Me
      </div>

      <div class="circle" id="circle"></div>

      <div class="output" id="mouseOutput"></div>
    </section>

    <!-- Keyboard -->
    <section class="card">
      <h2>Keyboard Events</h2>

      <input
        id="keyboardInput"
        placeholder="Type something..."
      >

      <div class="output" id="keyboardOutput"></div>
    </section>

    <!-- Input -->
    <section class="card">
      <h2>Input Events</h2>

      <input
        id="liveInput"
        placeholder="Live typing..."
      >

      <select id="country">
        <option>Pakistan</option>
        <option>Turkey</option>
        <option>Malaysia</option>
      </select>

      <div class="output" id="inputOutput"></div>
    </section>

    <!-- Form -->
    <section class="card">
      <h2>Form Events</h2>

      <form id="form">

        <input
          type="text"
          placeholder="Full Name"
          id="name"
        >

        <input
          type="email"
          placeholder="Email"
          id="email"
        >

        <button type="submit">
          Register
        </button>

      </form>

      <div class="output" id="formOutput"></div>
    </section>

    <!-- Event Propagation -->
    <section class="card">

      <h2>Propagation Playground</h2>

      <div class="parent">

        Parent

        <div class="child">

          Child

          <div class="grandchild">
            Button
          </div>

        </div>

      </div>

      <div class="output" id="propagationOutput"></div>

    </section>

    <!-- Event Delegation -->
    <section class="card">

      <h2>Event Delegation</h2>

      <ul id="todoList">

        <li>Learn Events</li>
        <li>Practice Events</li>
        <li>Master JavaScript</li>

      </ul>

      <button id="addItem">
        Add Item
      </button>

      <div class="output" id="delegationOutput"></div>

    </section>

    <div id="parent">
    Parent
    <br>
    <br>
    <button id="child">Click Me</button>
    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
