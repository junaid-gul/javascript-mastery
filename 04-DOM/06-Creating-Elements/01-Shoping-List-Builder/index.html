<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping List Builder</title>
  <link rel="stylesheet" href="style.css">
 
</head>

<body>

  <div class="container">

    <h1>Shopping List Builder</h1>

    <div class="input-group">
      <input
        type="text"
        id="item-input"
        placeholder="Enter item..."
      >

      <button id="add-btn">
        Add Item
      </button>
    </div>

    <ul id="shopping-list" class="shopping-list">

      <li id="milk" class="shopping-item">
        <span class="item-text">Milk</span>
        <button class="delete-btn">Delete</button>
      </li>

      <li id="bread" class="shopping-item">
        <span class="item-text">Bread</span>
        <button class="delete-btn">Delete</button>
      </li>

      <li id="eggs" class="shopping-item">
        <span class="item-text">Eggs</span>
        <button class="delete-btn">Delete</button>
      </li>

    </ul>

    <div class="actions">

      <button id="duplicate-btn">
        Duplicate Bread
      </button>

      <button id="replace-btn">
        Replace Milk
      </button>

      <button id="clear-btn">
        Clear List
      </button>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
